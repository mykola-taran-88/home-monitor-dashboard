name = "home-monitor-dashboard"
main = "src/index.js"
compatibility_date = "2026-10-25"

# Serve the dashboard Worker on a workers.dev subdomain.
workers_dev = true

[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = ["/", "/index.html"]

[[services]]
binding = "HOME_MONITOR_BOT"
service = "home-monitor-bot"

